<style>
/* VOICE: tendre, festif, intime — un cadeau qu'on ouvre chaque matin
   IDEA: un bocal en verre rempli de petits papiers pliés, posé sur une nappe rouge
   PICTURE: le bocal dessiné en SVG, ses papiers diminuent au fil de l'année
   COLOUR and TYPE: rouge Noël dominant, papier crème en support, or en accent ; Fraunces + Nunito
   LAYOUT: une colonne mobile : bocal, bouton piocher, papier déplié, compte à rebours, historique */
:root{color-scheme:light dark;
--bg:light-dark(#a3111c,#3d060b);--bg2:light-dark(#8a0c16,#2a0407);
--paper:light-dark(#fffaf0,#f6ecd9);--ink:#2b1414;--soft:#fff;--gold:#f3c969;--red:#b3121b;--muted:light-dark(#f7d4d6,#e7b9bc)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:radial-gradient(120% 70% at 50% 0%,var(--bg) 40%,var(--bg2));min-height:100vh;color:var(--soft);font:16px/1.55 Nunito,system-ui,sans-serif;overflow-x:clip;
padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.wrap{max-width:520px;margin:0 auto;padding:22px 18px 48px;position:relative;z-index:1}
h1{-webkit-user-select:none;user-select:none;font:800 clamp(32px,9vw,44px)/1.05 Fraunces,Georgia,serif;margin:6px 0 4px;text-align:center;text-wrap:balance}
.sub{text-align:center;color:var(--muted);margin:0 0 6px;font-size:15px}
.jarbox{position:relative;width:min(78vw,300px);aspect-ratio:1/1.12;margin:8px auto 0}
.jarbox svg{width:100%;height:100%;display:block;filter:drop-shadow(0 18px 22px rgba(0,0,0,.35))}
.jarbox.shake svg{animation:shake .6s}
@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-4deg)}40%{transform:rotate(4deg)}60%{transform:rotate(-2deg)}80%{transform:rotate(2deg)}}
.btn{display:block;width:100%;min-height:52px;border:0;border-radius:14px;background:var(--gold);color:#4a1b05;font:700 18px Nunito,sans-serif;cursor:pointer;box-shadow:0 4px 0 #b88a2a;margin-top:18px}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #b88a2a}
.btn:focus-visible,.hist button:focus-visible,summary:focus-visible{outline:3px solid #fff;outline-offset:3px}
.paper{background:var(--paper);color:var(--ink);border-radius:6px;padding:20px 20px 16px;margin-top:20px;box-shadow:0 14px 30px rgba(0,0,0,.35);position:relative;
background-image:linear-gradient(180deg,transparent 49.6%,rgba(0,0,0,.06) 50%,transparent 50.6%)}
.paper.open{animation:unfold .7s cubic-bezier(.2,.8,.2,1)}
@keyframes unfold{0%{transform:scaleY(.08) rotate(-3deg);opacity:0}60%{transform:scaleY(1.03)}100%{transform:none;opacity:1}}
.ph{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14px;font-weight:700;color:var(--red);border-bottom:1px dashed #e0b4b4;padding-bottom:8px}
.ph i{font-weight:600}
.pt{font:600 20px/1.4 Fraunces,Georgia,serif;margin:14px 0 14px;text-wrap:pretty}
.pf{font-size:14px;color:#7a4a4a;text-align:center}
.count{text-align:center;margin:30px 0 8px}
.count b{display:block;font:800 clamp(56px,18vw,84px)/1 Fraunces,Georgia,serif;color:var(--gold)}
.count span{color:var(--muted);font-size:16px}
details{margin-top:26px;background:rgba(0,0,0,.16);border-radius:14px;padding:4px 14px}
summary{cursor:pointer;font-weight:700;padding:12px 0;min-height:44px}
.hist{list-style:none;margin:0 0 10px;padding:0}
.hist li{border-top:1px solid rgba(255,255,255,.14);padding:10px 0}
.hist .d{font-size:13px;color:var(--muted);font-weight:700}
.hist p{margin:2px 0 0;font-size:15px}
.hist button{background:none;border:1px dashed var(--gold);color:var(--gold);border-radius:10px;padding:8px 12px;font:600 15px Nunito,sans-serif;margin-top:4px;min-height:44px;cursor:pointer}
.note{font-size:13px;color:var(--muted);text-align:center;margin-top:24px}
.preview{background:rgba(0,0,0,.25);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.preview input{font:16px Nunito,sans-serif;padding:6px 8px;border-radius:8px;border:0}
#snow{position:fixed;inset:0;pointer-events:none;z-index:0}
@media (prefers-reduced-motion:reduce){.paper.open,.jarbox.shake svg{animation:none}#snow{display:none}}
.paper{margin-top:64px!important;padding-top:58px!important}
.art{position:absolute;left:50%;top:-56px;width:104px;height:108px;transform:translateX(-50%);filter:drop-shadow(0 6px 6px rgba(0,0,0,.18))}
.paper.open .art{animation:pop .9s .35s both cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:translateX(-50%) translateY(30px) scale(.4);opacity:0}100%{transform:translateX(-50%);opacity:1}}
.paper.kpn{border-top:8px solid #c8102e}.paper.kf{border-top:8px solid #1f6f5c}.paper.kd{border-top:8px solid #f3c969}
.paper.kf .ph{color:#1f6f5c}.paper.kd .ph{color:#9a6a10}
.ph{justify-content:center!important;text-align:center}.ph i{width:100%;order:-1;font-size:13px;letter-spacing:.2px}
.pt{text-align:center}
.sig{font:400 28px/1 "Dancing Script",cursive;color:#c8102e;text-align:right;margin:-4px 6px 12px}
.hi{width:26px;height:27px;display:inline-block;vertical-align:-8px;margin-right:6px}
@media (prefers-reduced-motion:reduce){.paper.open .art{animation:none}}
</style>
</head>
<body>
<canvas id="snow" aria-hidden="true"></canvas>
<main class="wrap">
  <div id="pv"></div>
  <h1>Le bocal de Noël</h1>
  <p class="sub" id="sub">Un petit papier par jour jusqu'au 25 décembre</p>
  <div class="jarbox" id="jarbox"><svg id="jar" viewBox="0 0 300 336" role="img" aria-label="Bocal rempli de petits papiers"></svg></div>
  <div id="main"></div>
  <div class="count" id="count"></div>
  <div id="history"></div>
  <p class="note" id="tip">Astuce : sur iPhone, touche Partager puis « Sur l'écran d'accueil » pour installer l'appli.</p>
</main>
<script>
{
const MSG=[["pn", "Bonne année ! Ici le Père Noël. Les rennes dorment, les lutins rangent l'atelier… et moi, je compte déjà les jours jusqu'au prochain Noël. On le fait ensemble ?"], ["d", "Avant de ranger les décorations, garde-en une seule bien en vue toute l'année : un petit bout de Noël au quotidien."], ["f", "Le mot « Noël » vient du latin natalis, qui veut dire « naissance »."], ["pn", "Rapport de l'atelier : Tornade le renne a dormi 14 heures d'affilée. Après la tournée de décembre, on ne peut pas lui en vouloir !"], ["d", "Écris trois souvenirs du Noël qui vient de passer avant qu'ils s'effacent. Garde le papier pour le relire en décembre."], ["f", "C'est l'Épiphanie ! En Italie, c'est la Befana, une gentille sorcière sur son balai, qui apporte les cadeaux aux enfants ce jour-là."], ["d", "Galette des rois : si tu tombes sur la fève, tu es reine pour la journée… et le Père Noël le notera dans son grand livre."], ["pn", "Les lutins ont voté : cette année, ta lettre sera lue en premier. Tu as onze mois pour la peaufiner !"], ["f", "Dans les Églises orthodoxes, Noël se fête souvent le 7 janvier : en Russie, en Serbie ou en Éthiopie, on vient tout juste de le célébrer."], ["d", "Prépare-toi un chocolat chaud à la cannelle et savoure-le au calme. Noël, ça s'entretient."], ["pn", "Mère Noël s'est lancé un défi tricot : 100 bonnets pour les lutins avant le printemps. Elle en est à 3. Croise les doigts pour elle."], ["f", "La première carte de Noël imprimée date de 1843, à Londres. Sir Henry Cole l'avait commandée, trop occupé pour écrire à tous ses amis."], ["d", "Fais le tri dans tes décorations : celles qui sont abîmées, répare-les ou remplace-les pendant les soldes."], ["pn", "Ici, au pôle Nord, il fait -32 °C. Les rennes adorent. Moi, je reste près du feu avec un bon livre."], ["f", "La couronne de l'Avent avec ses bougies a été inventée en 1839 à Hambourg par un pasteur, pour aider les enfants à patienter jusqu'à Noël."], ["d", "Profite des soldes pour dénicher un objet rouge de Noël à petit prix. Tu le ressortiras en décembre."], ["pn", "Comète a appris à faire des bulles avec son chewing-gum. Les lutins sont fascinés. La productivité de l'atelier, beaucoup moins."], ["f", "En Islande, on s'offre des livres le 24 décembre et on passe la soirée à lire : c'est le Jólabókaflóð, le « déluge de livres de Noël »."], ["d", "Choisis un livre qui se passe à Noël et commence-le ce soir, même si c'est janvier."], ["pn", "Petite confidence : mon gâteau préféré n'est pas la bûche… c'est la galette ! Mais ne le dis pas à Mère Noël."], ["f", "En 1914, des soldats ennemis ont cessé de se battre le soir de Noël pour chanter et échanger de petits cadeaux : c'est la « trêve de Noël »."], ["d", "Envoie un petit message à quelqu'un que tu n'as pas vu pendant les fêtes. L'esprit de Noël n'attend pas décembre."], ["pn", "Les lutins ont mis la radio de l'atelier sur « chants de Noël en continu ». J'ai essayé de changer de station. Ils ont protesté."], ["f", "Les rennes vivent dans le Grand Nord et certains troupeaux parcourent des milliers de kilomètres chaque année lors de leurs migrations."], ["d", "Écoute « Petit Papa Noël » une fois aujourd'hui. Personne n'a besoin de le savoir."], ["pn", "Mes lunettes ont disparu. Danseur jure qu'il ne les a pas. Danseur porte des lunettes."], ["f", "On dit que le gui porte bonheur : on s'embrasse dessous au Nouvel An, d'où l'expression « Au gui l'an neuf »."], ["d", "Allume une bougie parfumée à la cannelle ou au sapin ce soir. Ferme les yeux. C'est presque Noël."], ["pn", "Les lutins trient le courrier de l'an dernier. Certaines lettres sont arrivées avec des dessins de rennes à cinq pattes. On les a affichées."], ["f", "Au Japon, le repas de Noël le plus populaire est… le poulet frit de KFC, grâce à une campagne publicitaire lancée en 1974."], ["d", "Premier mois tenu ! Récompense-toi avec un petit carré de chocolat."], ["pn", "Février au pôle Nord : les aurores boréales sont magnifiques. Je t'en envoie une par la pensée."], ["f", "Le 2 février, c'est la Chandeleur. Dans la tradition, c'était le jour où l'on rangeait enfin la crèche."], ["d", "Fais des crêpes et saupoudre-les de sucre glace, comme de la neige."], ["pn", "Rodolphe a le nez qui brille un peu moins en ce moment. Le vétérinaire dit que c'est un petit rhume. Il est sous plaid et tisane."], ["f", "Rodolphe le renne au nez rouge a été inventé en 1939 par Robert L. May, pour un livret offert par un grand magasin américain."], ["d", "Regarde un film de Noël ce soir. Oui, en février. Tu as le droit."], ["pn", "Les lutins testent un nouveau modèle de luge. Trois sont dans la neige jusqu'aux oreilles. Les essais continuent."], ["f", "Les rennes du Père Noël ont des noms depuis 1823, grâce au poème américain « A Visit from St. Nicholas ». Rodolphe n'est arrivé que bien plus tard."], ["d", "Cite les 9 rennes de mémoire. Réponse : Tornade, Danseur, Furie, Fringant, Comète, Cupidon, Tonnerre, Éclair… et Rodolphe !"], ["pn", "Mère Noël veut repeindre la cuisine. En rouge, évidemment. Je n'ai pas eu mon mot à dire."], ["f", "La tradition du sapin décoré est très ancienne en Alsace : un registre de Sélestat en parle dès 1521."], ["d", "Cherche une recette de bredele (petits biscuits alsaciens) et mets-la de côté pour décembre."], ["pn", "Demain, c'est la Saint-Valentin. Cupidon le renne est surexcité : pour une fois, c'est lui la vedette de l'équipe."], ["f", "Joyeuse Saint-Valentin ! Parmi les rennes du Père Noël, il y en a un qui s'appelle… Cupidon."], ["d", "Offre-toi un petit plaisir rouge aujourd'hui : un vernis, une fleur, un fruit… tant que c'est rouge."], ["pn", "J'ai reçu une lettre pour l'an prochain. Elle commence par : « Cher Père Noël, je sais que c'est tôt, mais… ». J'adore."], ["f", "Selon la légende, les boules de Noël en verre seraient nées à Meisenthal, en Moselle : en 1858, faute de pommes pour décorer les sapins, un verrier en aurait soufflé."], ["d", "Prends une photo d'un paysage d'hiver ou d'une jolie vitrine, et commence un album « Noël toute l'année »."], ["pn", "Les lutins ont organisé une bataille de boules de neige. Je n'ai rien vu. Absolument rien. (J'ai gagné.)"], ["f", "Au Mexique, les Posadas rythment les fêtes : neuf soirées, du 16 au 24 décembre, qui rejouent la recherche d'un abri par Marie et Joseph."], ["d", "Apprends à dire « Joyeux Noël » dans une nouvelle langue. En breton : « Nedeleg laouen »."], ["pn", "Bulletin météo : 40 cm de neige cette nuit. Les lutins ont mis deux heures à retrouver la porte de l'atelier."], ["f", "En Catalogne, les enfants tapent sur une bûche souriante, le Caga Tió, pour qu'elle « fasse » des bonbons et des petits cadeaux."], ["d", "Fais une liste de cinq choses qui, pour toi, sentent Noël. Ajoute-en une nouvelle chaque mois."], ["pn", "Éclair a battu son record de vitesse à l'entraînement. Je ne te dirai pas lequel : secret industriel."], ["f", "L'étoile de Noël (poinsettia) vient du Mexique. Son nom anglais vient de Joel Poinsett, le diplomate américain qui l'a fait connaître."], ["d", "Achète une petite plante d'intérieur et baptise-la d'un nom de renne."], ["pn", "Fin février : les jours rallongent, mais ici on garde les guirlandes allumées. On ne sait jamais."], ["pn", "Le printemps approche ! Au pôle Nord, ça veut dire -15 °C au lieu de -30. Les lutins sortent en t-shirt."], ["f", "La toute première crèche vivante a été organisée par saint François d'Assise en 1223, dans le village de Greccio, en Italie."], ["d", "Ouvre ta boîte de décorations et choisis un ornement à réparer ou à rafraîchir ce mois-ci."], ["pn", "Les lutins dessinent les jouets de cette année. Il y a beaucoup de licornes. Et un dinosaure qui chante « Vive le vent »."], ["f", "La version française de « Vive le vent » a été écrite en 1948 par Francis Blanche, sur l'air de « Jingle Bells »."], ["d", "Chante « Vive le vent » sous la douche. Couplets compris, si tu les connais."], ["pn", "Mère Noël a lancé un club de lecture au pôle Nord. Premier livre : « Un chant de Noël ». Évidemment."], ["f", "« Un chant de Noël » de Charles Dickens a été publié en décembre 1843. Le premier tirage était épuisé avant le réveillon."], ["d", "Regarde une adaptation d'« Un chant de Noël ». Il y en a pour tous les goûts, même avec les Muppets."], ["pn", "Pause thé avec les rennes. Furie a renversé sa tasse. Furie renverse toujours sa tasse."], ["f", "Dans la tradition de la Saint-Nicolas, le Père Fouettard accompagne le saint pour gronder les enfants pas sages."], ["d", "Note une bonne action que tu as faite aujourd'hui. Le Père Noël tient les comptes toute l'année !"], ["pn", "J'ai essayé un costume vert pour le printemps. Les lutins ont ri pendant dix minutes. Je reste en rouge."], ["f", "Contrairement à une idée reçue, ce n'est pas Coca-Cola qui a habillé le Père Noël en rouge : on le dessinait déjà ainsi bien avant ses publicités des années 1930."], ["d", "Porte quelque chose de rouge aujourd'hui, juste pour le plaisir."], ["pn", "Les rennes refont leurs bois chaque année. En ce moment, certains sont un peu gênés par leur coiffure."], ["f", "Chez les rennes, mâles et femelles ont des bois. Les mâles les perdent au début de l'hiver… ceux du traîneau seraient donc plutôt des femelles !"], ["d", "Dessine un renne en moins d'une minute. Garde le dessin : le Père Noël veut voir ça."], ["pn", "Rapport de l'atelier : 12 000 ours en peluche cousus ce mois-ci. Un lutin s'est cousu à un ours par erreur. Tout va bien."], ["f", "C'est le printemps ! En Australie, Noël tombe en plein été : on le fête souvent avec un barbecue ou à la plage."], ["d", "Fais ton rangement de printemps… en musique de Noël."], ["pn", "On plante les sapins de l'an prochain. Enfin, de dans dix ans. Les sapins, c'est patient."], ["f", "Un sapin de Noël cultivé met en général entre 7 et 10 ans pour atteindre la taille qu'on lui connaît dans nos salons."], ["d", "Cherche une idée de déco de Noël « fait maison » et enregistre-la pour décembre."], ["pn", "Mère Noël a fait des sablés en forme d'étoile « pour tester ». Il n'en reste plus. Je ne sais pas ce qui s'est passé."], ["f", "« Douce nuit » a été chanté pour la première fois le soir de Noël 1818, dans le petit village d'Oberndorf, en Autriche."], ["d", "Écoute trois versions différentes de « Douce nuit » et choisis ta préférée."], ["pn", "Les lutins ont fêté l'anniversaire de Tonnerre : gâteau aux carottes, bougies, et beaucoup trop de confettis."], ["f", "Les guirlandes scintillantes seraient nées vers 1610 à Nuremberg, en Allemagne. À l'époque, elles étaient faites de vrais fils d'argent."], ["d", "Envoie une carte postale à quelqu'un, juste comme ça."], ["pn", "Fin mars : plus que neuf mois ! Je compte sur toi pour garder l'esprit de Noël bien au chaud."], ["pn", "Poisson d'avril ! Les lutins ont accroché un poisson en papier dans le dos de chaque renne. Rodolphe le porte encore : il le trouve joli."], ["f", "Le mot « Avent » vient du latin adventus, qui veut dire « arrivée » ou « venue »."], ["d", "Raconte à quelqu'un ton plus beau souvenir de Noël d'enfance."], ["pn", "Les chocolats de Pâques envahissent les magasins. Ici, on fait des œufs… en forme de boules de Noël."], ["f", "Le premier calendrier de l'Avent imprimé est attribué à l'Allemand Gerhard Lang, au début du XXe siècle."], ["d", "Cache un petit chocolat quelque part chez toi et oublie-le. Le jour où tu le retrouveras, surprise !"], ["pn", "Grand nettoyage du traîneau : on a retrouvé un chausson, trois cartes de Noël et un biscuit de 2019."], ["f", "Les papillotes sont une spécialité lyonnaise : des chocolats enveloppés de papier brillant, avec une petite blague à l'intérieur."], ["d", "Écris un mot gentil sur un papier et glisse-le dans la poche ou le sac de quelqu'un que tu aimes."], ["pn", "Les lutins testent les nouveaux jeux de société. La partie a duré six heures. Personne n'est d'accord sur les règles."], ["f", "La Fête des Lumières de Lyon remonte à 1852 : le 8 décembre au soir, les Lyonnais ont illuminé leurs fenêtres avec des bougies."], ["d", "Organise une soirée jeux de société, comme un soir de réveillon."], ["pn", "Danseur prend des cours de danse. Il se dit prêt pour le réveillon. Personne n'a osé lui dire qu'on ne danse pas en volant."], ["f", "En Provence, on prépare 13 desserts pour Noël, en souvenir du Christ et des 12 apôtres."], ["d", "Fais la liste des 13 desserts que TU mettrais sur ta table de Noël idéale."], ["pn", "Mère Noël a ressorti sa machine à coudre : nouveaux costumes pour les lutins. Vert sapin, avec grelots."], ["f", "Les santons de Provence se sont répandus après la Révolution : les églises étant fermées, les familles ont recréé la crèche à la maison."], ["d", "Choisis une photo d'un de tes Noëls passés et mets-la en fond d'écran pour la semaine."], ["pn", "Petit secret : je garde toutes les lettres que je reçois. Certaines sont très, très anciennes. Elles sentent encore le chocolat."], ["f", "En France, il suffit d'écrire « Père Noël » sur l'enveloppe pour que la lettre arrive à son secrétariat. Pas besoin de timbre !"], ["d", "Commence ta lettre au Père Noël. Pas besoin de la finir : tu as jusqu'en décembre."], ["pn", "Mon secrétariat m'a envoyé son rapport : plus d'un million de lettres l'an dernier. Il me faut une deuxième paire de lunettes."], ["f", "Le secrétariat du Père Noël a ouvert en 1962 à Libourne, en Gironde. Françoise Dolto a rédigé la toute première réponse."], ["d", "Prépare une boîte à souvenirs de Noël : un ticket, une photo, une carte… tout ce qui te rappelle les fêtes."], ["pn", "Un rouge-gorge s'est installé sur le toit de l'atelier. On l'a appelé « Noël »."], ["f", "Au XIXe siècle, les facteurs anglais portaient un uniforme rouge et étaient surnommés « robins » (rouges-gorges). D'où tous ces oiseaux sur les cartes de Noël !"], ["d", "Mets quelques graines dehors pour les oiseaux. Les rouges-gorges te remercieront."], ["pn", "Atelier : on fabrique les trains électriques. Les lutins les testent… beaucoup. Pour la science."], ["f", "Les premières guirlandes électriques pour sapin ont été créées en 1882 par Edward Johnson, un associé de Thomas Edison."], ["d", "Installe une petite guirlande lumineuse quelque part chez toi. Pour le plaisir, sans raison."], ["pn", "Joyeux 1er mai ! Pas de muguet au pôle Nord, mais les lutins ont fabriqué des clochettes… en sucre d'orge."], ["f", "Selon la légende, la canne en sucre d'orge serait née en Allemagne au XVIIe siècle, pour faire patienter les enfants pendant la messe de Noël."], ["d", "Mange un bonbon à la menthe et imagine que c'est un sucre d'orge."], ["pn", "Les rennes reprennent l'entraînement en extérieur. Vol de nuit au-dessus des fjords. Magnifique."], ["f", "À Rovaniemi, en Laponie finlandaise, un « village du Père Noël » est installé pile sur le cercle polaire arctique."], ["d", "Fais la liste des destinations de Noël qui te font rêver : Strasbourg, Rovaniemi, New York…"], ["pn", "Mère Noël a ouvert les fenêtres : ça sent le pain d'épices dans tout le village. Les rennes font la queue devant la cuisine."], ["f", "Le marché de Noël de Strasbourg, le « Christkindelsmärik », existe depuis 1570. C'est l'un des plus anciens d'Europe."], ["d", "Cherche la date d'ouverture du marché de Noël le plus proche de chez toi et note-la dans ton agenda."], ["pn", "Petit incident : un lutin a confondu la peinture rouge et la sauce tomate. Les trains de cette année sentent un peu l'Italie."], ["f", "Les chaussettes de Noël viendraient d'une légende de saint Nicolas : il aurait lancé des pièces d'or par la cheminée, tombées dans des bas qui séchaient."], ["d", "Repère la chaussette de Noël que tu veux accrocher cette année (ou fabrique-la !)."], ["pn", "Les lutins font pousser des fraises sous serre. Rouges et sucrées : la couleur de mon manteau."], ["f", "En Suède, chaque 24 décembre à 15 h, des millions de personnes regardent un vieux dessin animé de Donald à la télévision. Une tradition depuis 1960 !"], ["d", "Regarde un dessin animé de Noël de ton enfance."], ["pn", "Comète apprend à lire, avec les lettres au Père Noël. Il trouve qu'il y a beaucoup de demandes de poneys."], ["f", "Le pain d'épices est une spécialité de Noël en Alsace, mais aussi à Dijon et à Reims, qui en ont fait leur réputation."], ["d", "Offre-toi un pain d'épices et déguste-le avec un thé. Même en mai, c'est délicieux."], ["pn", "Je suis allé chez le barbier. Il m'a coupé un centimètre de barbe. Mère Noël dit qu'elle ne voit aucune différence."], ["f", "La bûche de Noël était à l'origine une vraie bûche, qu'on faisait brûler longtemps dans la cheminée pour porter chance à la maison."], ["d", "Trouve une recette de bûche que tu n'as jamais faite et garde-la pour décembre."], ["pn", "Les lutins ont fabriqué une montgolfière rouge pour aller voir le soleil de minuit. Elle n'est pas encore sortie du hangar."], ["f", "Au pôle Nord, le soleil ne se couche pas pendant des mois en été : c'est le jour polaire."], ["d", "Profite d'une longue soirée douce pour te balader, et imagine les illuminations de décembre."], ["pn", "Mère Noël m'a mis au régime salade. J'ai trouvé un cookie caché dans la laitue. Je soupçonne Rodolphe."], ["f", "Le Grinch, le personnage qui voulait voler Noël, a été créé par le Dr Seuss en 1957."], ["d", "Fais une bonne action discrète aujourd'hui, comme un lutin : personne ne doit savoir que c'est toi."], ["pn", "Bilan de mi-saison : 34 % des jouets sont prêts. Les lutins sont fiers. Moi aussi."], ["f", "« Petit Papa Noël », chanté par Tino Rossi à partir de 1946, est l'un des disques les plus vendus de l'histoire en France."], ["d", "Envoie un petit mot doux à quelqu'un qui t'est cher, sans raison particulière."], ["pn", "Fin mai : plus que sept mois ! Les rennes trépignent déjà."], ["pn", "Juin au pôle Nord : le soleil brille jour et nuit. Les lutins ne savent plus quand aller se coucher."], ["f", "Le sapin de Trafalgar Square, à Londres, est offert chaque année par la Norvège depuis 1947, en remerciement de l'aide britannique pendant la guerre."], ["d", "Fais une playlist de Noël « version été » : jazz, reggae, acoustique…"], ["pn", "Les rennes ont eu droit à une baignade dans le lac. Furie a fait une bombe. Tout le monde a été trempé."], ["f", "En Norvège, on cachait autrefois les balais la veille de Noël, pour que les sorcières ne les volent pas pour s'envoler."], ["d", "Fais un pique-nique avec un dessert « de Noël » : biscuits à la cannelle ou petites meringues blanches comme la neige."], ["pn", "Mère Noël teste un nouveau parfum de bougie : « Sapin d'été ». Les lutins ne sont pas convaincus."], ["f", "En Pologne, on laisse souvent une place vide à la table du réveillon, pour un invité inattendu ou un voyageur de passage."], ["d", "Invite quelqu'un à partager un café ou un repas, comme on le ferait à Noël."], ["pn", "Petit bricolage : j'ai réparé une boîte à musique de 1920. Elle joue de nouveau « Douce nuit »."], ["f", "Le ballet « Casse-Noisette » de Tchaïkovski a été joué pour la première fois en 1892, à Saint-Pétersbourg."], ["d", "Écoute « La danse de la fée Dragée » de Casse-Noisette. Ferme les yeux et imagine la neige."], ["pn", "Un lutin a inventé une peluche qui ronronne quand on lui fait un câlin. Grand succès en interne."], ["f", "Les Américains parlent d'une tradition allemande : cacher un cornichon en verre dans le sapin. En réalité, presque aucun Allemand ne la connaît !"], ["d", "Cache un petit objet dans une pièce et demande à quelqu'un de le trouver, façon « cornichon de Noël »."], ["pn", "Canicule au pôle Nord : 12 °C ! Les rennes réclament des ventilateurs."], ["f", "En République tchèque, la tradition voulait qu'on garde la carpe du réveillon vivante dans la baignoire quelques jours avant Noël."], ["d", "Prépare une boisson fraîche « de Noël » : thé glacé à la cannelle, ou limonade fraise-menthe."], ["pn", "Les lutins ont créé une chorale. Leur chant préféré : « Mon beau sapin », à quatre voix. C'est très émouvant."], ["f", "« Mon beau sapin » est l'adaptation française d'un chant allemand, « O Tannenbaum »."], ["d", "C'est la fête de la musique ! Chante un chant de Noël à voix haute. Même un seul couplet."], ["pn", "Rodolphe est allé à la plage. Son nez brillait tellement que les bateaux l'ont pris pour un phare."], ["f", "En Ukraine, on accroche parfois des toiles d'araignée décoratives au sapin : selon une légende, une araignée aurait tissé des fils devenus argent."], ["d", "Fais un tour dans une boutique de déco et repère un objet de Noël qui te ferait plaisir."], ["pn", "Joyeux « demi-Noël » ! Nous sommes à six mois pile du 25 décembre. Ici, on fête ça avec une demi-bûche."], ["f", "Aux Philippines, les fêtes de Noël sont parmi les plus longues du monde : les décorations apparaissent souvent dès septembre !"], ["d", "Pour fêter le demi-Noël, allume une guirlande ou sors un objet de Noël le temps d'une soirée."], ["pn", "Les lutins partent en vacances la semaine prochaine. Leurs valises sont pleines de chocolat chaud en poudre. On ne se refait pas."], ["f", "En Scandinavie, le lutin de Noël (nisse ou tomte) reçoit un bol de bouillie de riz le soir de Noël, sinon il fait des farces !"], ["d", "Fin juin : fais le point sur ta lettre au Père Noël. Tu as ajouté quelque chose ?"], ["pn", "Les lutins sont en vacances ! L'atelier est calme. J'en profite pour faire la sieste dans le traîneau."], ["f", "Aux États-Unis et en Australie, certains fêtent « Christmas in July » : un Noël en plein été, avec sapin et repas de fête."], ["d", "Organise ton propre « Noël en juillet » : un dessert, un chant, une déco… et c'est la fête."], ["pn", "Carte postale de Comète : il est en vacances en Norvège chez des cousins. Les fjords sont superbes, mais il y a trop de touristes."], ["f", "À Caracas, au Venezuela, une tradition veut qu'on se rende à la messe de Noël… en patins à roulettes !"], ["d", "Fais une activité d'enfant aujourd'hui : balançoire, glace à l'eau, marelle. L'esprit de Noël, c'est aussi ça."], ["pn", "Mère Noël fait de la confiture de myrtilles. Les rennes surveillent la cuisine avec beaucoup d'intérêt."], ["f", "En Autriche et en Bavière, le Krampus, une créature à cornes, accompagne saint Nicolas pour effrayer les enfants pas sages."], ["d", "Fais (ou achète) une confiture de fruits rouges, et garde un pot pour le petit-déjeuner de Noël."], ["pn", "J'ai fait un tour en barque. Les poissons du lac ne savent pas qui je suis. C'est reposant."], ["f", "« White Christmas » de Bing Crosby est considéré comme le single le plus vendu de tous les temps."], ["d", "Écoute « White Christmas » avec un grand verre d'eau glacée. Ambiance neige garantie."], ["f", "La maison en pain d'épices est devenue populaire en Allemagne au XIXe siècle, après le conte « Hansel et Gretel » des frères Grimm."], ["pn", "Bonne fête nationale ! Les lutins ont tiré un feu d'artifice. Rouge, uniquement rouge. Ils ont des goûts très arrêtés."], ["d", "Dessine les plans de la maison en pain d'épices que tu construiras en décembre."], ["pn", "Tonnerre s'est mis au yoga. Sa position préférée : le renne tête en bas."], ["f", "En Islande, il n'y a pas un, mais treize lutins de Noël, les Jólasveinar, qui arrivent un par un pendant les jours qui précèdent Noël."], ["d", "Achète dès maintenant une jolie carte de Noël, pour l'envoyer à quelqu'un en décembre."], ["pn", "Lettre reçue en juillet : « Cher Père Noël, je sais que tu es en vacances, mais je voulais être le premier. » Il l'est."], ["f", "En Grèce, les légendes parlent de petits lutins farceurs, les kallikantzaroi, qui sortent pendant les douze jours de Noël."], ["d", "Offre-toi un petit rien à moins de 2 € qui te fait sourire."], ["pn", "Les rennes ont fait un concours de sieste. Tout le monde a gagné."], ["f", "Les « crackers » de Noël, ces papillotes anglaises qui éclatent quand on tire dessus, ont été inventés à Londres vers 1847 par le confiseur Tom Smith."], ["d", "Dans cinq mois, c'est le réveillon ! Imagine ton menu idéal et note-le."], ["pn", "Plus que cinq mois ! Les lutins rentrent de vacances la semaine prochaine. Moi, je profite encore un peu."], ["f", "En Russie, c'est Ded Moroz, le « Grand-père Gel », accompagné de sa petite-fille Snegourotchka, qui apporte les cadeaux au Nouvel An."], ["d", "Prépare un dessert glacé et décore-le en bonhomme de neige."], ["pn", "Mère Noël a fait la liste des nouveautés de l'année. Elle fait trois mètres de long. Elle trouve que c'est raisonnable."], ["f", "Un flocon de neige a presque toujours six branches, et on dit qu'il n'en existe pas deux identiques."], ["d", "Découpe un flocon de neige en papier et colle-le sur ta fenêtre. En plein été, effet garanti."], ["pn", "Fin juillet : les lutins sont rentrés, bronzés et motivés. L'atelier reprend demain !"], ["pn", "Reprise à l'atelier ! Les machines ronronnent, les lutins chantent. Ça sent bon la colle et le chocolat."], ["f", "La fête de Noël a été fixée au 25 décembre au IVe siècle. Le plus ancien document qui la mentionne date de 336, à Rome."], ["d", "Fais l'inventaire de tes papiers cadeaux, rubans et étiquettes. Note ce qui manque."], ["pn", "Rodolphe a retrouvé ses bois de l'an dernier au fond de l'écurie. Il veut en faire un portemanteau."], ["f", "Au Royaume-Uni, le roi s'adresse à la nation le jour de Noël, une tradition lancée en 1932 à la radio par George V."], ["d", "Note dans ton agenda les dates de décembre à ne pas manquer : marchés de Noël, spectacles, réveillon…"], ["pn", "Mère Noël a goûté le nouveau chocolat chaud des lutins. Elle a dit « parfait ». C'est le plus beau compliment possible."], ["f", "Les clémentines, classiques de Noël, doivent leur nom au frère Clément, qui les aurait obtenues en Algérie vers 1900."], ["d", "Prépare une boisson fraîche aux agrumes et à la cannelle."], ["pn", "Une lutine a inventé un pull de Noël qui clignote. Il faut l'éteindre la nuit, sinon les rennes ne dorment pas."], ["f", "Au Royaume-Uni, il existe un « Christmas Jumper Day » : tout le monde porte un pull de Noël pour récolter des dons pour les enfants."], ["d", "Repère ton pull de Noël pour cet hiver. Plus il est kitsch, mieux c'est."], ["pn", "Souci logistique : il manque 2 000 grelots. Des lutins ont été envoyés en mission dans tout le Grand Nord."], ["f", "Le bœuf et l'âne de la crèche ne sont pas cités dans les Évangiles : ils ont été ajoutés plus tard par la tradition."], ["d", "Ajoute un personnage à ta crèche, ou fabriques-en un en papier."], ["pn", "Les rennes s'entraînent à atterrir sur les toits en pente. Danseur a glissé. Il dit que c'était exprès."], ["f", "« Le Père Noël est une ordure » est sorti au cinéma en 1982. C'est l'un des films de Noël préférés des Français."], ["d", "Fais la liste de tes cinq films de Noël préférés et programme-les pour décembre."], ["pn", "Mère Noël fait sécher des tranches d'orange pour les décorations. Tout le village sent l'agrume."], ["f", "Les tranches d'orange séchées sont une décoration de Noël traditionnelle dans de nombreux pays d'Europe du Nord."], ["d", "Fais sécher quelques tranches d'orange au four (2 à 3 h à 100 °C) et garde-les pour décorer ton sapin."], ["pn", "J'ai essayé mon costume. Il est un peu juste. Mère Noël dit « ce sont les cookies ». Moi, je dis que le tissu a rétréci."], ["f", "« Maman, j'ai raté l'avion ! » est sorti en 1990. Il est devenu un incontournable de Noël dans le monde entier."], ["d", "Plus que quatre mois : commence ta liste de cadeaux pour la famille."], ["pn", "Plus que quatre mois ! J'ai ressorti mon grand livre des enfants sages. Ton nom y est. En lettres dorées."], ["f", "Depuis 1955, l'armée américaine « suit » le traîneau du Père Noël chaque 24 décembre… à cause d'un numéro de téléphone mal imprimé dans une publicité."], ["d", "Fais quelque chose de gentil pour un voisin aujourd'hui."], ["pn", "Les lutins ont repeint le traîneau. Rouge brillant. On peut se voir dedans."], ["f", "Le réveillon tient son nom du verbe « réveiller » : c'était le repas pris au milieu de la nuit, après la messe de minuit."], ["d", "Trouve une nouvelle recette pour ton menu de réveillon et note-la."], ["pn", "Fin août : au pôle Nord aussi, c'est bientôt la grande rentrée… des jouets !"], ["pn", "C'est la rentrée ! Les lutins ont reçu leurs nouveaux tabliers. Moi, j'ai un nouveau carnet pour les listes."], ["f", "Aux Philippines, les décorations de Noël apparaissent dès septembre : c'est le début des « ber months » (september, october, november, december)."], ["d", "Installe un petit objet de Noël chez toi dès aujourd'hui, comme aux Philippines."], ["pn", "Les premières feuilles tombent. Les rennes adorent se rouler dedans. C'est leur façon de dire que Noël approche."], ["f", "Les marchés de Noël viennent d'Allemagne et d'Alsace, où l'on vendait jouets, biscuits et décorations pendant l'Avent."], ["d", "Prévois tes week-ends de décembre : marché de Noël, déco, pâtisserie…"], ["pn", "J'ai testé le chocolat chaud de la rentrée. Verdict : il faut plus de chantilly. Toujours plus de chantilly."], ["f", "Le Père Noël s'inspire de saint Nicolas, évêque de Myre (dans l'actuelle Turquie) au IVe siècle, connu pour sa générosité."], ["d", "Prépare-toi un chocolat chaud avec beaucoup de chantilly. Ordre du Père Noël."], ["pn", "Premier test de production : 1 000 toupies en une heure. Record battu !"], ["f", "Aux Pays-Bas, Sinterklaas arrive en bateau à la mi-novembre. Son nom serait à l'origine de « Santa Claus », emporté en Amérique par les colons hollandais."], ["d", "Ouvre une liste « Idées cadeaux » sur ton téléphone et note chaque idée dès qu'elle passe."], ["pn", "Mère Noël a sorti ses recettes de biscuits. 47 au total. Elle dit qu'elle va « faire simple » cette année."], ["f", "Les bredele sont de petits biscuits de Noël alsaciens. Chaque famille a ses recettes : anis, cannelle, amandes, beurre…"], ["d", "Teste une recette de biscuit de Noël, « pour t'entraîner »."], ["pn", "Le traîneau a passé le contrôle technique. Freins OK. Grelots OK. Coussin du siège : à changer."], ["f", "« Joyeux Noël » se dit « Nedeleg laouen » en breton, « Bon Natale » en corse et « Eguberri on » en basque."], ["d", "Fais la liste des personnes à qui tu veux envoyer une carte de Noël cette année."], ["pn", "Réunion avec les rennes : on a revu l'itinéraire. On passera chez toi vers minuit. Laisse la cheminée libre."], ["f", "Avant les boules en verre, on décorait les sapins avec des pommes, des noix et des petits gâteaux."], ["d", "Ramasse pommes de pin, branchages ou noix en promenade : ils feront de jolies décorations naturelles."], ["pn", "C'est l'automne ! Ici, il neige déjà. Les lutins vont à l'atelier en luge."], ["f", "Le soir du 24, beaucoup d'enfants laissent du lait et des biscuits pour le Père Noël… et une carotte pour les rennes."], ["d", "Mets un plaid rouge sur ton canapé. La saison cosy est ouverte."], ["pn", "Plus que trois mois ! J'ai mis mes chaussons rouges, ça m'aide à me concentrer."], ["f", "Le rouge de Noël rappelle les baies de houx, les pommes qui décoraient les premiers sapins et le manteau de l'évêque saint Nicolas."], ["d", "Fais la liste des chants de Noël que tu veux absolument écouter cette année."], ["pn", "Les lutins ont fini les poupées. Elles ont toutes un petit nœud rouge : c'est la signature de l'atelier."], ["f", "En Provence, on dresse trois nappes blanches pour le réveillon, l'une sur l'autre."], ["d", "Fin septembre : note déjà une idée de cadeau pour le Secret Santa de l'an prochain. On ne sait jamais !"], ["pn", "Octobre ! Les magasins sortent les décos de Noël. Ne laisse personne te dire que c'est trop tôt."], ["f", "Le gui était déjà sacré pour les druides gaulois, qui le cueillaient, dit-on, avec une serpe d'or."], ["d", "Va faire un tour au rayon Noël d'un magasin. Juste pour regarder. (Bon, et peut-être une petite chose.)"], ["pn", "Les rennes ont commencé leur régime « spécial tournée » : lichen, carottes et beaucoup de repos."], ["f", "Le houx, avec ses feuilles piquantes et ses baies rouges, décore les mais     drawJar(359);
    const k=-i;
    main.innerHTML=`<article class="paper kpn"><div class="art">${ART.pn}</div><div class="ph"><span>Bientôt</span><i>★ Mot du Père Noël</i></div><p class="pt">Ce bocal contient 359 petits papiers. Le premier se pioche le 1er janvier 2027… patience, c'est bientôt !</p><div class="pf">Ouverture dans ${k} jour${k>1?"s":""}</div></article>`;
    cnt.innerHTML="";document.getElementById("history").innerHTML="";return;
  }
  const last=Math.min(i,MSG.length-1),done=i>=MSG.length-1;
  drawJar(MSG.length-1-last+(opened.has(last)?0:1));
  if(i>MSG.length-1){
    main.innerHTML=`<article class="paper kpn"><div class="art">${ART.pn}</div><div class="ph"><span>Après Noël</span><i>★ Mot du Père Noël</i></div><p class="pt">Le bocal est vide, mais tous les messages de l'année restent ici, juste en dessous. Merci d'avoir attendu Noël avec moi !</p><div class="pf">Joyeuses fêtes</div></article>`;
  }else if(opened.has(i)){
    main.innerHTML=paperHTML(i,anim);
  }else{
    main.innerHTML=`<button class="btn" id="pick">Piocher le papier du jour</button>`;
    document.getElementById("pick").onclick=()=>{
      const jb=document.getElementById("jarbox");jb.classList.remove("shake");void jb.offsetWidth;jb.classList.add("shake");
      setTimeout(()=>{opened.add(i);save();render(true)},450);
    };
  }
  const n=daysTo(t,NOEL);
  cnt.innerHTML=n>0?`<b>${n}</b><span>jour${n>1?"s":""} avant Noël</span>`:n===0?`<b>Joyeux Noël !</b>`:"";
  // historique
  const items=[];
  for(let k=last-(i<=MSG.length-1?1:0);k>=0;k--){
    const d=dateOf(k);
    items.push(opened.has(k)
      ?`<li><div class="d"><span class="hi">${ART[MSG[k][0]]}</span>${fmt(d)} · ${TAG[MSG[k][0]]}</div><p>${esc(MSG[k][1])}</p></li>`
      :`<li><div class="d">${fmt(d)}</div><button data-k="${k}">Papier oublié : le piocher</button></li>`);
  }
  const h=document.getElementById("history");
  h.innerHTML=items.length?`<details${done?" open":""}><summary>Les papiers des jours précédents (${items.length})</summary><ul class="hist">${items.join("")}</ul></details>`:"";
  h.querySelectorAll("button[data-k]").forEach(b=>b.onclick=()=>{opened.add(+b.dataset.k);save();render();const dd=document.querySelector("#history details");if(dd)dd.open=true});
}
addEventListener("hashchange",()=>{preview=location.hash==="#apercu";if(!preview)fake=null;render()});
let taps=0,tt;document.querySelector("h1").addEventListener("click",()=>{taps++;clearTimeout(tt);tt=setTimeout(()=>taps=0,1500);if(taps>=5){taps=0;preview=!preview;if(!preview)fake=null;render()}});
render();
// minuit : rafraîchir
setInterval(()=>{if(!fake)render()},60000);

// neige légère
const cv=document.getElementById("snow"),cx=cv.getContext("2d");let W,H,fl=[];
const size=()=>{W=cv.width=innerWidth;H=cv.height=innerHeight;fl=Array.from({length:Math.min(70,Math.round(W/8))},()=>({x:Math.random()*W,y:Math.random()*H,r:1+Math.random()*2.5,s:.3+Math.random()*.8,w:Math.random()*6}))};
size();addEventListener("resize",size);
if(!matchMedia("(prefers-reduced-motion: reduce)").matches){
  const tick=()=>{cx.clearRect(0,0,W,H);cx.fillStyle="rgba(255,255,255,.75)";
    for(const f of fl){f.y+=f.s;f.w+=.02;f.x+=Math.sin(f.w)*.4;if(f.y>H){f.y=-5;f.x=Math.random()*W}cx.beginPath();cx.arc(f.x,f.y,f.r,0,7);cx.fill()}
    requestAnimationFrame(tick)};tick();
}
}
if(matchMedia("(display-mode: standalone)").matches||navigator.standalone){const t=document.getElementById("tip");if(t)t.remove()}
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{})}
</script>
